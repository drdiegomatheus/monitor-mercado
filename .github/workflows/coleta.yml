name: coleta
on:
  schedule:
    - cron: "*/5 * * * *"         # cripto 24h; Brasil, EUA, setores, commodities e macro no horário do pregão (seg-sex, 10h-18h de Brasília)
  workflow_dispatch:
    inputs:
      modo:
        description: completo (tudo) ou agenda (só o que está no horário)
        default: completo
permissions:
  contents: write
  actions: write
concurrency:
  group: coleta
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: inicio
        run: echo "T0=$(date +%s)" >> $GITHUB_ENV
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: dados anteriores
        run: |
          git fetch -q origin dados || { echo "ainda não existe o ramo dados"; exit 0; }
          git checkout -q origin/dados -- . || true
      - name: coleta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.modo }}" != "agenda" ]; then python monitor.py --salvar; exit 0; fi
          h=$(date -u +%H); m=$(date -u +%M); d=$(date -u +%u)
          python monitor.py --salvar --cat cripto
          if [ "$d" -le 5 ] && { { [ "$h" -ge 13 ] && [ "$h" -le 20 ]; } || { [ "$h" = "21" ] && [ "$m" -lt 5 ]; }; }; then
            for c in brasil eua setores commodities macro; do python monitor.py --salvar --cat $c; done
          fi
          if [ "$m" -lt 5 ] && { [ "$h" = "13" ] || [ "$h" = "02" ]; }; then python monitor.py --salvar --cat juros; fi
      - name: pre e pos mercado EUA
        run: python monitor.py --ext || true
      - name: mercado
        run: python monitor.py --mercado || true
      - name: eventos
        run: python monitor.py --eventos || true
      - name: painel
        run: python monitor.py --painel
      - name: guardar
        # Os dados vão para o ramo "dados", que é recriado a cada rodada com um único commit.
        # Assim o repositório não cresce a cada coleta (o código fica no ramo main).
        run: |
          git config user.name "coleta"; git config user.email "coleta@users.noreply.github.com"
          ARQ=""
          for f in painel.html painel_*.html ext.json index.html manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png apple-touch-icon.png categorias/*/dados categorias/*/relatorio.html categorias/*/eventos.json categorias/*/mercado.json categorias/*/_meta.json; do
            if [ -e "$f" ]; then ARQ="$ARQ $f"; fi
          done
          git checkout -q --orphan dados_novo
          git rm -rf -q --cached .
          git add -f $ARQ
          git commit -q -m "dados $(date -u +%F_%H%M)"
          for i in 1 2 3; do git push -q -f origin dados_novo:dados && break || sleep 5; done
      - name: proxima rodada em 5 min
        # O agendamento do GitHub (cron) atrasa e pula rodadas; por isso cada rodada agenda a seguinte.
        # O cron fica só como reserva: se a corrente parar, ele a reinicia.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git checkout -q main 2>/dev/null || true
          espera=$(( 300 - ($(date +%s) - T0) )); [ "$espera" -gt 0 ] && sleep "$espera"
          outras=$(gh api "repos/${{ github.repository }}/actions/workflows/coleta.yml/runs?status=queued&per_page=5" -q '.total_count' || echo 0)
          if [ "$outras" = "0" ]; then
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/coleta.yml/dispatches" -f ref=main -f "inputs[modo]=agenda" || true
          fi
