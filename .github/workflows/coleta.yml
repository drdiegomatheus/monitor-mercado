name: coleta
on:
  schedule:
    - cron: "*/15 * * * *"   # a cada 15 min, todos os dias
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: coleta
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python monitor.py --salvar
      - run: |
          git config user.name "coleta"; git config user.email "coleta@users.noreply.github.com"
          git add -A categorias
          git commit -m "dados $(date -u +%F_%H%M)" || echo "sem mudanças"
          git push
