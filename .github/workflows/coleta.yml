name: coleta
on:
  schedule:
    - cron: "30 15 * * 1-5"
    - cron: "15 21 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas numpy
      - run: python monitor.py --salvar
      - run: |
          git config user.name "coleta"; git config user.email "coleta@users.noreply.github.com"
          git add -A dados relatorios
          git commit -m "dados $(date -u +%F_%H%M)" || echo "sem mudanças"
          git push
