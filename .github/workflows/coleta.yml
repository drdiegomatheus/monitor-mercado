name: coleta
on:
  schedule:
    - cron: "*/15 * * * *"        # cripto 24h; Brasil, EUA, setores, commodities e macro no horário do pregão (seg-sex, 10h-18h de Brasília)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: coleta
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: coleta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then python monitor.py --salvar; exit 0; fi
          h=$(date -u +%H); m=$(date -u +%M); d=$(date -u +%u)
          python monitor.py --salvar --cat cripto
          if [ "$d" -le 5 ] && { { [ "$h" -ge 13 ] && [ "$h" -le 20 ]; } || { [ "$h" = "21" ] && [ "$m" -lt 15 ]; }; }; then
            for c in brasil eua setores commodities macro; do python monitor.py --salvar --cat $c; done
          fi
          if [ "$m" -lt 15 ] && { [ "$h" = "13" ] || [ "$h" = "02" ]; }; then python monitor.py --salvar --cat juros; fi
      - name: mercado
        run: python monitor.py --mercado || true
      - name: eventos
        run: python monitor.py --eventos || true
      - name: painel
        run: python monitor.py --painel
      - name: guardar
        run: |
          git config user.name "coleta"; git config user.email "coleta@users.noreply.github.com"
          git add -A categorias painel.html
          git commit -m "dados $(date -u +%F_%H%M)" || { echo "sem mudanças"; exit 0; }
          for i in 1 2 3; do git pull --rebase -q && git push && break || sleep 5; done
