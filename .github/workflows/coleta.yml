name: coleta
on:
  schedule:
    - cron: "*/15 * * * *"        # cripto: 24h, a cada 15 min
    - cron: "5 13-21 * * 1-5"     # Brasil e EUA: de hora em hora, seg-sex, 10h-18h de Brasília
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: coleta
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: coleta
        run: |
          case "${{ github.event.schedule }}" in
            "*/15 * * * *") python monitor.py --salvar --cat cripto ;;
            "5 13-21 * * 1-5") python monitor.py --salvar --cat brasil; python monitor.py --salvar --cat eua; python monitor.py --salvar --cat setores; python monitor.py --salvar --cat commodities; python monitor.py --salvar --cat macro; python monitor.py --salvar --cat juros ;;
            *) python monitor.py --salvar ;;
          esac
      - name: mercado
        run: python monitor.py --mercado || true
      - name: eventos
        run: python monitor.py --eventos || true
      - name: painel
        run: python monitor.py --painel
      - name: guardar
        run: |
          git config user.name "coleta"; git config user.email "coleta@users.noreply.github.com"
          git add -A categorias painel.html
          git commit -m "dados $(date -u +%F_%H%M)" || { echo "sem mudanças"; exit 0; }
          for i in 1 2 3; do git pull --rebase -q && git push && break || sleep 5; done
