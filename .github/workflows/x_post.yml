name: x_post
on:
  workflow_dispatch:
    inputs:
      texto:
        description: texto do post (até 280 caracteres)
        required: true
      publicar:
        description: "publicar de verdade? (sim/nao; nao = só mostra o texto)"
        default: "nao"
permissions:
  contents: read
jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests-oauthlib
      - name: postar
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          TEXTO: ${{ inputs.texto }}
        run: |
          if [ "${{ inputs.publicar }}" = "sim" ]; then python x_post.py "$TEXTO" --publicar; else python x_post.py "$TEXTO"; fi
