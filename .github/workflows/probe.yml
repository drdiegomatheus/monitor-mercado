name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python analise/probe.py
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
      - run: |
          git config user.name "robo"; git config user.email "robo@users.noreply.github.com"
          git add analise/probe.json; git commit -m "probe brapi" || true
          git pull --rebase -q origin main || true
          git push origin HEAD:main
