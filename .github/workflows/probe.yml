name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: npm install @mathieuc/tradingview
      - run: node analise/probe_tv.js
        continue-on-error: true
      - run: |
          git config user.name "robo"; git config user.email "robo@users.noreply.github.com"
          git add -f analise/probe.json; git commit -m "probe tradingview" || true
          git pull --rebase -q origin main || true
          git push origin HEAD:main
