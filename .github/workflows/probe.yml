name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas
      - run: python analise/probe_fund.py
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add -f analise/probe_fund.json; git commit -qm "probe fund result"; git pull -q --rebase; git push -q
