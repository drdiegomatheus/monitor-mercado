name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: |
          git fetch -q origin baleias && git show origin/baleias:carteiras.json > carteiras.json
          python analise/probe_tf.py
      - run: |
          git config user.name "robo"; git config user.email "robo@users.noreply.github.com"
          git add -f analise/probe_tf.json; git commit -m "probe" || true
          git pull --rebase -q origin main || true
          git push origin HEAD:main
