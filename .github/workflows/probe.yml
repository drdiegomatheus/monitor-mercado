name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: python analise/probe_onchain.py
      - run: |
          git config user.name bot; git config user.email bot@x
          git add -f analise/probe_onchain.json
          git commit -m "probe onchain" && git pull -q --rebase origin main && git push origin HEAD:main
