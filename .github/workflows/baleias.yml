name: baleias
on:
  schedule:
    - cron: "7,37 * * * *"        # reserva: reinicia a corrente se ela parar
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: baleias
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: inicio
        run: echo "T0=$(date +%s)" >> $GITHUB_ENV
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: estado anterior
        run: |
          git fetch -q origin baleias && git show origin/baleias:baleias.json > baleias.json || echo "sem estado anterior"
          git show origin/baleias:carteiras.json > carteiras.json 2>/dev/null || true
      - name: varredura
        run: timeout 330 python baleias.py
      - name: carteiras vencedoras
        run: timeout 120 python carteiras.py || true
      - name: guardar estado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s baleias.json ] || exit 0
          d=$(mktemp -d); cp baleias.json "$d"/; [ -s carteiras.json ] && cp carteiras.json "$d"/; cd "$d"
          git init -q; git checkout -q -b baleias
          git -c user.name=bot -c user.email=bot@x add .
          git -c user.name=bot -c user.email=bot@x commit -qm "estado das baleias"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" baleias
      - name: proxima rodada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          espera=$(( 420 - ($(date +%s) - T0) )); [ "$espera" -gt 0 ] && sleep "$espera"
          outras=0
          for s in queued pending waiting; do
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/baleias.yml/runs?status=$s&per_page=5" -q '.total_count' || echo 0)
            outras=$((outras + n))
          done
          if [ "$outras" = "0" ]; then
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/baleias.yml/dispatches" -f ref=main || true
          fi
